@if (breadcrumbs().length > 0) {
  <nav class="flex flex-wrap items-center gap-2 mb-4 text-sm">
    @for (item of breadcrumbs(); track item.id; let last = $last) {
      @if (!last) {
        <span class="text-muted-color">{{ item.short_name || item.name }}</span>
        <i class="pi pi-chevron-right text-xs text-muted-color"></i>
      } @else {
        <span class="font-medium">{{ item.short_name || item.name }}</span>
        <p-tag [value]="formatType(item.type)" />
      }
    }
  </nav>
}
