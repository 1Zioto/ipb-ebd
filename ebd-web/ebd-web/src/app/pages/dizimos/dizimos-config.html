<div class="mb-4">
  <h1 class="m-0 text-2xl font-semibold">Configurações de Dízimos</h1>
  <p class="text-muted-color">Parâmetros de alerta, privacidade e regras operacionais</p>
</div>
@if (successMsg()) { <p-message severity="success" styleClass="mb-4 w-full">{{ successMsg() }}</p-message> }
@if (loading()) {
  <div class="card flex justify-center p-8"><i class="pi pi-spin pi-spinner text-2xl"></i></div>
} @else {
  <div class="grid grid-cols-12 gap-4 mb-4">
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h3 class="mt-0">Motor de alertas pastoral</h3>
        <div class="flex flex-col gap-3">
          <div>
            <label class="block mb-2">Ativar alertas automáticos</label>
            <select class="w-full p-inputtext p-component" [(ngModel)]="settings.tithes_alerts_enabled">
              <option value="true">Sim — Ativado</option>
              <option value="false">Não — Desativado</option>
            </select>
          </div>
          <div><label class="block mb-2">Meses mínimos de histórico</label><input pInputText class="w-full" type="number" min="1" max="12" [(ngModel)]="settings.tithes_min_history_months" /></div>
          <div><label class="block mb-2">Meses consecutivos com queda</label><input pInputText class="w-full" type="number" min="1" max="6" [(ngModel)]="settings.tithes_consecutive_months" /></div>
          <div><label class="block mb-2">Percentual mínimo de queda (%)</label><input pInputText class="w-full" type="number" min="5" max="90" step="5" [(ngModel)]="settings.tithes_drop_percentage" /></div>
          <div><label class="block mb-2">Meses sem contribuição para interrupção</label><input pInputText class="w-full" type="number" min="1" max="6" [(ngModel)]="settings.tithes_no_contribution_months" /></div>
        </div>
      </div>
    </div>
    <div class="col-span-12 xl:col-span-6">
      <div class="card">
        <h3 class="mt-0">Regras das coletas semanais</h3>
        <div class="flex flex-col gap-3">
          <div>
            <label class="block mb-2">Dupla conferência no fechamento</label>
            <select class="w-full p-inputtext p-component" [(ngModel)]="settings.tithes_require_double_check">
              <option value="false">Não</option>
              <option value="true">Sim</option>
            </select>
          </div>
          <div>
            <label class="block mb-2">Múltiplos lançamentos no mesmo domingo</label>
            <select class="w-full p-inputtext p-component" [(ngModel)]="settings.tithes_allow_multiple_entries">
              <option value="true">Sim — com aviso</option>
              <option value="false">Não</option>
            </select>
          </div>
          <div>
            <label class="block mb-2">Contribuições não identificadas</label>
            <select class="w-full p-inputtext p-component" [(ngModel)]="settings.tithes_allow_unidentified">
              <option value="true">Sim</option>
              <option value="false">Não</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p-button label="Salvar configurações" icon="pi pi-check" [loading]="saving()" (onClick)="saveSettings()" />
}
