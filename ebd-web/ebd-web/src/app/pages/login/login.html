<app-floating-configurator />
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center px-4 py-8">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-16" style="border-radius: 53px; max-width: 42rem">
        <div class="text-center mb-6">
          <img src="ipb-logo.png" alt="Igreja Presbiteriana do Brasil" class="mb-6 w-16 h-16 mx-auto object-contain" />
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-2">Escola Bíblica Dominical</div>
          <span class="text-muted-color font-medium">Gestão integrada da igreja</span>
        </div>

        <div class="flex gap-2 mb-6 p-1 rounded-border bg-surface-100 dark:bg-surface-800">
          <p-button
            label="Entrar"
            icon="pi pi-sign-in"
            [outlined]="isRegisterMode()"
            styleClass="flex-1"
            (onClick)="isRegisterMode() ? toggleMode() : null"
          />
          <p-button
            label="Nova Igreja"
            icon="pi pi-building"
            [outlined]="!isRegisterMode()"
            styleClass="flex-1"
            (onClick)="!isRegisterMode() ? toggleMode() : null"
          />
        </div>

        @if (error()) {
          <p-message severity="error" [text]="error()!" styleClass="mb-4 w-full" />
        }
        @if (successMsg()) {
          <p-message severity="success" [text]="successMsg()!" styleClass="mb-4 w-full" />
        }

        @if (!isRegisterMode()) {
          <form (ngSubmit)="submitLogin()" class="flex flex-col gap-4">
            <div>
              <label for="username" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Usuário *</label>
              <input pInputText id="username" type="text" placeholder="Digite seu usuário..." class="w-full" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" autocomplete="username" />
            </div>
            <div>
              <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">Senha *</label>
              <p-password id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="Digite sua senha..." [toggleMask]="true" [fluid]="true" [feedback]="false" autocomplete="current-password" />
            </div>
            <p-button type="submit" label="Entrar" icon="pi pi-sign-in" styleClass="w-full" [loading]="loading()" [disabled]="loading() || !username().trim() || !password()" />
          </form>
        } @else {
          <form (ngSubmit)="submitRegister()" class="flex flex-col gap-4">
            <div class="text-lg font-semibold text-surface-900 dark:text-surface-0">Dados da Nova Igreja</div>
            <div>
              <label class="block font-medium mb-2">Nome Oficial da Igreja *</label>
              <input pInputText class="w-full" [ngModel]="churchName()" (ngModelChange)="churchName.set($event)" name="churchName" placeholder="Ex: Igreja Presbiteriana em Vila Nova" required />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block font-medium mb-2">Sigla / Nome Curto *</label>
                <input pInputText class="w-full" [ngModel]="shortName()" (ngModelChange)="shortName.set($event)" name="shortName" placeholder="Ex: IP Vila Nova" required />
              </div>
              <div>
                <label class="block font-medium mb-2">Tipo *</label>
                <p-select [options]="typeOptions" optionLabel="label" optionValue="value" [ngModel]="type()" (ngModelChange)="type.set($event)" name="type" styleClass="w-full" />
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block font-medium mb-2">Cidade</label>
                <input pInputText class="w-full" [ngModel]="city()" (ngModelChange)="city.set($event)" name="city" placeholder="Ex: Cariacica" />
              </div>
              <div>
                <label class="block font-medium mb-2">Estado (UF)</label>
                <input pInputText class="w-full" [ngModel]="state()" (ngModelChange)="state.set($event)" name="state" placeholder="Ex: ES" />
              </div>
            </div>
            <div>
              <label class="block font-medium mb-2">Código da Instituição Superior (Opcional)</label>
              <input pInputText class="w-full" [ngModel]="superiorCode()" (ngModelChange)="superiorCode.set($event)" name="superiorCode" placeholder="Ex: INST-8X9K2P" />
            </div>
            <div class="text-lg font-semibold text-surface-900 dark:text-surface-0 mt-2">Usuário Administrador</div>
            <div>
              <label class="block font-medium mb-2">Nome do Responsável *</label>
              <input pInputText class="w-full" [ngModel]="adminName()" (ngModelChange)="adminName.set($event)" name="adminName" placeholder="Ex: João da Silva" required />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block font-medium mb-2">Nome de Usuário *</label>
                <input pInputText class="w-full" [ngModel]="adminUsername()" (ngModelChange)="adminUsername.set($event)" name="adminUsername" placeholder="Ex: joao.admin" required />
              </div>
              <div>
                <label class="block font-medium mb-2">E-mail (Opcional)</label>
                <input pInputText class="w-full" type="email" [ngModel]="adminEmail()" (ngModelChange)="adminEmail.set($event)" name="adminEmail" placeholder="admin@igreja.org" />
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block font-medium mb-2">Senha de Acesso *</label>
                <p-password [ngModel]="regPassword()" (ngModelChange)="regPassword.set($event)" name="regPassword" placeholder="Mínimo 6 caracteres" [toggleMask]="true" [fluid]="true" [feedback]="false" />
              </div>
              <div>
                <label class="block font-medium mb-2">Confirmar Senha *</label>
                <p-password [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" placeholder="Repita a senha" [toggleMask]="true" [fluid]="true" [feedback]="false" />
              </div>
            </div>
            <p-button type="submit" label="Cadastrar Igreja e Entrar" icon="pi pi-check" styleClass="w-full" [loading]="loading()" [disabled]="loading() || !churchName().trim() || !shortName().trim() || !adminUsername().trim() || !regPassword()" />
          </form>
        }
      </div>
    </div>
  </div>
</div>
