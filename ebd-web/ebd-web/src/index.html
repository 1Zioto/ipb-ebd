<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EBD | Igreja Presbiteriana do Brasil</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      try {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('desktop') === '1') {
          sessionStorage.setItem('ipb_force_desktop', '1');
        }
        var forceDesktop = sessionStorage.getItem('ipb_force_desktop') === '1';

        if (isMobile && !forceDesktop && !window.location.pathname.startsWith('/mobile')) {
          window.location.replace('/mobile/');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="ipb-logo.png">
  <link rel="apple-touch-icon" href="ipb-logo.png">
  <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
</head>
<body>
  <app-root></app-root>
  <script src="html2pdf.bundle.min.js"></script>
  <script>
    if (!window.html2pdf) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
