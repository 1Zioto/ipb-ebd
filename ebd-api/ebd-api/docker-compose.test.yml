services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipb_test
      POSTGRES_USER: ipb_test
      POSTGRES_PASSWORD: ipb_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipb_test -d ipb_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
